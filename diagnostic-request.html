<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل طلب اختبار تشخيصي — بالقلم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.08);max-width:440px;width:100%;padding:28px 24px}
  .logo{text-align:center;font-size:26px;font-weight:800;color:#3b82f6;margin-bottom:4px}
  .sub{text-align:center;font-size:13px;color:#64748b;margin-bottom:20px}
  .fg{margin-bottom:14px}
  .fl{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:6px}
  .fi{width:100%;padding:11px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-family:'Cairo',sans-serif;font-size:14px;background:#f8fafc;color:#0f172a}
  .fi:focus{outline:none;border-color:#3b82f6;background:#fff}
  select.fi{cursor:pointer}
  .req{color:#ef4444}
  .btn{width:100%;padding:13px;border:none;border-radius:10px;background:#3b82f6;color:#fff;font-family:'Cairo',sans-serif;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px}
  .btn:disabled{background:#94a3b8;cursor:not-allowed}
  .msg{text-align:center;padding:14px;border-radius:10px;font-size:14px;font-weight:700;margin-top:14px;display:none}
  .msg.ok{background:#dcfce7;color:#15803d;display:block}
  .msg.err{background:#fee2e2;color:#b91c1c;display:block}
  .done{text-align:center;padding:20px 0}
  .done .ic{font-size:48px;margin-bottom:10px}
  .done h2{font-size:18px;color:#15803d;margin-bottom:8px}
  .done p{font-size:13px;color:#64748b;line-height:1.7}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">بالقلم</div>
  <div class="sub">نموذج تسجيل طلب اختبار تشخيصي</div>

  <form id="diagForm">
    <div class="fg">
      <label class="fl">اسم الطالب <span class="req">*</span></label>
      <input id="f-name" class="fi" required placeholder="الاسم الكامل">
    </div>
    <div class="fg">
      <label class="fl">الصف</label>
      <input id="f-grade" class="fi" placeholder="مثال: الصف الثالث">
    </div>
    <div class="fg">
      <label class="fl">رقم التواصل (واتساب) <span class="req">*</span></label>
      <input id="f-phone" class="fi" type="tel" required placeholder="3XXXXXXX">
    </div>
    <div class="fg">
      <label class="fl">نوع الاختبار <span class="req">*</span></label>
      <select id="f-type" class="fi" required>
        <option value="arabic">لغة عربية</option>
        <option value="ld">صعوبات تعلم</option>
      </select>
    </div>
    <div class="fg">
      <label class="fl">اليوم المناسب للاختبار <span class="req">*</span></label>
      <input id="f-date" class="fi" type="date" required>
    </div>
    <div class="fg">
      <label class="fl">الوقت المناسب <span class="req">*</span></label>
      <input id="f-time" class="fi" type="time" required>
    </div>
    <button class="btn" type="submit" id="submitBtn">إرسال الطلب</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="done" id="doneBox" style="display:none">
    <div class="ic">✅</div>
    <h2>تم إرسال طلبكم بنجاح</h2>
    <p>شكرًا لكم. سيتم التواصل معكم من أكاديمية بالقلم لتأكيد موعد الاختبار التشخيصي.</p>
  </div>
</div>

<script>
const SB_URL = 'https://kfxdslytyicueybljnsa.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmeGRzbHl0eWljdWV5YmxqbnNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNzkxODgsImV4cCI6MjA5Mzk1NTE4OH0.R-MAI7C1w0XAVt7lU_Ug5jkiH8fKTLQbpapdyPjl0xY';
const DB_KEY = 'diagnostic'; // same localStorage key the main app uses for this list

async function submitDiagRequest(entry){
  // 1) اقرأ آخر نسخة محفوظة بالسحابة لهذه القائمة
  const getRes = await fetch(`${SB_URL}/rest/v1/bealqalam_data?select=key,value&key=eq.${DB_KEY}`, {
    headers:{ apikey: SB_KEY, Authorization: 'Bearer '+SB_KEY }
  });
  if(!getRes.ok) throw new Error('fetch failed');
  const rows = await getRes.json();
  let list = [];
  try{ list = rows[0]?.value ? JSON.parse(rows[0].value) : []; }catch{ list = []; }
  if(!Array.isArray(list)) list = [];

  // 2) ضيف الطلب الجديد
  list.push(entry);

  // 3) ارفع النسخة المحدثة (upsert على نفس الصف)
  const putRes = await fetch(`${SB_URL}/rest/v1/bealqalam_data`, {
    method:'POST',
    headers:{
      apikey: SB_KEY,
      Authorization: 'Bearer '+SB_KEY,
      'Content-Type':'application/json',
      Prefer:'resolution=merge-duplicates'
    },
    body: JSON.stringify([{ key: DB_KEY, value: JSON.stringify(list), updated_at: new Date().toISOString() }])
  });
  if(!putRes.ok) throw new Error('save failed');
}

// ما نسمح باختيار يوم قبل اليوم
(function(){
  const t = new Date(); const pad = n => String(n).padStart(2,'0');
  document.getElementById('f-date').min = t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
})();

document.getElementById('diagForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.className = 'msg';

  const name  = document.getElementById('f-name').value.trim();
  const grade = document.getElementById('f-grade').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const type  = document.getElementById('f-type').value;
  const date  = document.getElementById('f-date').value;
  const time  = document.getElementById('f-time').value;

  if(!name || !phone || !date || !time){
    msg.textContent = 'عبوا الحقول المطلوبة من فضلكم';
    msg.className = 'msg err';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'جارِ الإرسال...';

  const clean = (v,n) => String(v||'').replace(/[<>"'`&]/g,'').slice(0,n).trim();
  const entry = {
    id: 'diag_'+Date.now(),
    name: clean(name,80),
    phone: clean(phone,20).replace(/[^0-9+ ]/g,''),
    grade: clean(grade,40),
    date, time, type: type==='ld' ? 'ld' : 'arabic',
    result:'', status:'pending',
    notes:'تم التسجيل عبر رابط ولي الأمر',
    source:'parent'
  };

  try{
    await submitDiagRequest(entry);
    document.getElementById('diagForm').style.display='none';
    document.getElementById('doneBox').style.display='block';
  }catch(err){
    console.warn(err);
    msg.textContent = 'حصل خطأ، حاول مرة ثانية أو تواصل معنا مباشرة';
    msg.className = 'msg err';
    btn.disabled = false;
    btn.textContent = 'إرسال الطلب';
  }
});
</script>
</body>
</html>
