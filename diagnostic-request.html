<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل طلب اختبار تشخيصي — بالقلم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px}
  .card{background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.08);max-width:460px;width:100%;padding:28px 22px}
  .logo{text-align:center;margin-bottom:4px}
  .logo img{width:70px;height:70px;object-fit:contain}
  .logo b{display:block;font-size:22px;font-weight:900;color:#0f172a;line-height:1.2}
  .sub{text-align:center;font-size:13px;color:#64748b;margin-bottom:20px}
  .fg{margin-bottom:14px}
  .fl{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:6px}
  .fi{width:100%;padding:11px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-family:'Cairo',sans-serif;font-size:14px;background:#f8fafc;color:#0f172a}
  .fi:focus{outline:none;border-color:#3b82f6;background:#fff}
  select.fi{cursor:pointer}
  .req{color:#ef4444}
  .hint{font-size:11px;color:#64748b;margin-top:5px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;border:1.5px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-weight:800;font-size:14px;cursor:pointer;transition:.15s;color:#334155}
  .seg input:checked + label{border-color:#3b82f6;background:#eff6ff;color:#1d4ed8}
  .seg input:focus-visible + label{outline:2px solid #93c5fd}
  .paste{background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:12px;padding:10px;margin-bottom:16px}
  .paste-t{width:100%;background:none;border:none;font-family:'Cairo',sans-serif;font-size:13.5px;font-weight:800;color:#1d4ed8;cursor:pointer;padding:2px}
  .paste textarea{margin-top:8px;resize:vertical;min-height:110px;line-height:1.7}
  .paste .btn{margin-top:8px;padding:10px}
  .paste-res{font-size:12.5px;line-height:1.8;margin-top:8px;color:#334155}
  .paste-res b{color:#15803d}
  .paste-res .miss{color:#b45309}
  .fi.filled,.seg.filled label{border-color:#10b981}
  .fi.filled{background:#ecfdf5}
  .btn{width:100%;padding:13px;border:none;border-radius:10px;background:#3b82f6;color:#fff;font-family:'Cairo',sans-serif;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn:disabled{background:#94a3b8;cursor:not-allowed}
  .btn.wa{background:#25d366}
  .btn.dark{background:#0f172a}
  .btn.ghost{background:#fff;color:#334155;border:1.5px solid #e2e8f0}
  .msg{text-align:center;padding:14px;border-radius:10px;font-size:14px;font-weight:700;margin-top:14px;display:none}
  .msg.ok{background:#dcfce7;color:#15803d;display:block}
  .msg.err{background:#fee2e2;color:#b91c1c;display:block}

  /* ── شاشة بعد التسجيل ── */
  #doneBox{display:none}
  .done-h{text-align:center;margin-bottom:14px}
  .done-h .ic{font-size:40px;line-height:1}
  .done-h h2{font-size:18px;color:#15803d;margin-top:6px}
  .done-h p{font-size:12.5px;color:#64748b}
  .acts{display:grid;gap:8px;margin-top:14px}

  /* ── استمارة التأكيد (هذي اللي تنحفظ صورة وتنرسل لولي الأمر) ── */
  .slip{background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;overflow:hidden;font-family:'Cairo',sans-serif;color:#0f172a}
  .slip .hd{background:#0f172a;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px;position:relative}
  .slip .hd::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;background:#f5a623}
  .slip .hd img{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;flex-shrink:0}
  .slip .hd .n{font-size:18px;font-weight:900;line-height:1.25}
  .slip .hd .s{font-size:11.5px;color:#cbd5e1}
  .slip .bd{padding:20px 18px 14px}
  .slip .t{font-size:16px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .slip .t i{display:inline-block;width:6px;height:20px;background:#f5a623;border-radius:3px}
  .slip .when{background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:12px;padding:10px 12px;text-align:center;margin-bottom:12px}
  .slip .when .l{font-size:11.5px;color:#1d4ed8;font-weight:800}
  .slip .when .d{font-size:17px;font-weight:900;line-height:1.5}
  .slip .when .h{font-size:20px;font-weight:900;color:#1d4ed8;line-height:1.3}
  .slip table{width:100%;border-collapse:collapse;font-size:14px}
  .slip td{padding:8px 4px;border-bottom:1px dashed #e2e8f0;vertical-align:top}
  .slip tr:last-child td{border-bottom:none}
  .slip td.k{color:#64748b;font-weight:700;width:42%;font-size:13px}
  .slip td.v{font-weight:800}
  .slip .pill{display:inline-block;padding:1px 10px;border-radius:20px;font-size:12.5px;font-weight:800}
  .slip .note{margin-top:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.8}
  .slip .ft{border-top:1.5px solid #e2e8f0;margin:0 18px;padding:10px 0 14px;font-size:11px;color:#94a3b8;display:flex;justify-content:space-between;gap:8px}
</style>
</head>

<script>
const SB_URL = 'https://kfxdslytyicueybljnsa.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmeGRzbHl0eWljdWV5YmxqbnNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNzkxODgsImV4cCI6MjA5Mzk1NTE4OH0.R-MAI7C1w0XAVt7lU_Ug5jkiH8fKTLQbpapdyPjl0xY';
const DB_KEY = 'diagnostic'; // same localStorage key the main app uses for this list
// نفس رابط Apps Script حق الاكسل — فيه دالة ترسل إيميل تنبيه عند كل طلب جديد
const NOTIFY_URL = 'https://script.google.com/macros/s/AKfycbyT1M42vQBKX6K8G1NJaxEQ3s8a_-9hm3iSurWceGSlYxHPGCqol2VTojgcfcxa_MYHSg/exec';
const LOGO = document.querySelector('.logo img').src;

// ── قواعد الحجز ──
const MAX_PER_DAY = 5;             // أقصى عدد اختبارات باليوم
const DAYS_AHEAD  = 30;            // نعرض الأيام المتاحة لشهر قدّام
const FRIDAY = 5;                  // getDay(): الجمعة = 5
// الأوقات: من 4:00 إلى 7:00 مساءً كل ربع ساعة
const FIRST_MIN = 16*60, LAST_MIN = 19*60, STEP_MIN = 15;
const ALLOWED_TIMES = [];
for(let m=FIRST_MIN; m<=LAST_MIN; m+=STEP_MIN) ALLOWED_TIMES.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));

// ── معلومات الاستمارة ──
const LOCATION_TXT = 'سار — مبنى جمعية سار الخيرية / خلف المسجد الوسطي';
const LOCATION_URL = 'https://maps.app.goo.gl/npa3Per6Bs7vFdQh7?g_st=iw';
const TYPE_LABEL = {arabic:'لغة عربية', ld:'صعوبات تعلم'};
const MODE_LABEL = {onsite:'حضوري', online:'أونلاين'};

const pad = n => String(n).padStart(2,'0');
const isoLocal = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function timeLabel(t){const [h,m]=t.split(':').map(Number);return (h>12?h-12:h)+':'+pad(m)+' مساءً';}
function dateLabel(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ar-BH-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}

// قائمة الأوقات
// الأوقات اللي فاتت اليوم (نخلي ربع ساعة فرق على الأقل)
function timePassedToday(dateIso, t){
  const now=new Date();
  if(dateIso!==isoLocal(now)) return false;
  const [h,m]=t.split(':').map(Number);
  return h*60+m < now.getHours()*60+now.getMinutes()+15;
}
function renderTimes(){
  const sel=document.getElementById('f-time'), date=document.getElementById('f-date').value, keep=sel.value;
  sel.innerHTML = '<option value="">اختر الوقت</option>' + ALLOWED_TIMES.map(t=>{
    const past=timePassedToday(date,t);
    return `<option value="${t}"${past?' disabled':''}>${timeLabel(t)}${past?' — فات':''}</option>`;
  }).join('');
  if(keep && !timePassedToday(date,keep)) sel.value=keep;
}
renderTimes();
document.getElementById('f-date').addEventListener('change',renderTimes);

async function fetchDiagList(){
  const res = await fetch(`${SB_URL}/rest/v1/bealqalam_data?select=key,value&key=eq.${DB_KEY}`, {
    headers:{ apikey: SB_KEY, Authorization: 'Bearer '+SB_KEY }, cache:'no-store'
  });
  if(!res.ok) throw new Error('fetch failed');
  const rows = await res.json();
  let list = [];
  try{ list = rows[0]?.value ? JSON.parse(rows[0].value) : []; }catch{ list = []; }
  return Array.isArray(list) ? list : [];
}

// كم اختبار محجوز بهذا اليوم (ما نحسب اللي ما حضروا)
function countOnDay(list, iso){
  return list.filter(d => d && d.date === iso && d.status !== 'noshow').length;
}

function dayAllowed(list, iso){
  const [y,m,dd] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, dd);
  if(dt.getDay() === FRIDAY) return 'friday';
  if(countOnDay(list, iso) >= MAX_PER_DAY) return 'full';
  return 'ok';
}

async function loadDays(){
  const sel = document.getElementById('f-date');
  try{
    const list = await fetchDiagList();
    const opts = ['<option value="">اختر اليوم</option>'];
    const today = new Date();
    for(let i=0; i<=DAYS_AHEAD; i++){ // من اليوم
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate()+i);
      if(d.getDay() === FRIDAY) continue; // الجمعة ما تنعرض أصلاً
      // اليوم نفسه: نعرضه بس إذا باقي وقت متاح فيه
      if(i===0 && ALLOWED_TIMES.every(t=>timePassedToday(isoLocal(d),t))) continue;
      const iso = isoLocal(d);
      const label = (i===0?'اليوم — ':i===1?'بكرة — ':'') + d.toLocaleDateString('ar-BH-u-nu-latn',{weekday:'long', day:'numeric', month:'long'});
      const left = MAX_PER_DAY - countOnDay(list, iso);
      opts.push(left > 0
        ? `<option value="${iso}">${label}</option>`
        : `<option value="${iso}" disabled>${label} — مكتمل</option>`);
    }
    sel.innerHTML = opts.join('');
  }catch(e){
    sel.innerHTML = '<option value="">تعذّر تحميل الأيام — حدّث الصفحة</option>';
  }
}
const DAYS_READY = loadDays();
// ═══ لصق المعلومات: يقرأ رسالة (واتساب مثلاً) ويوزعها على الخانات ═══
function parseInfo(raw, today){
  today = today || new Date();
  const AR = '٠١٢٣٤٥٦٧٨٩', FA = '۰۱۲۳۴۵۶۷۸۹';
  let txt = String(raw||'')
    .replace(/[٠-٩]/g, d => AR.indexOf(d)).replace(/[۰-۹]/g, d => FA.indexOf(d))
    .replace(/[‎‏‪-‮]/g,'').replace(/\r/g,'').replace(/[٫]/g,':');
  const norm = s => s.replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
  const lines = txt.split(/\n+|[،,؛;]/).map(l => l.replace(/^[\s\-–•*·▪✓✔👤🎓📞📱📝📍📅🕒⏰☎️]+/u,'').trim()).filter(Boolean);
  const out = {};
  const used = new Set();

  // قيمة بعد عنوان: "الاسم: ..." أو "اسم الطالب - ..."
  const LABELS = {
    name:  /^(اسم\s*(الطالب|الطالبه|الطفل|الابن|البنت|الولد)?|الاسم|الطالب|الطالبه)\s*[:：\-–=]\s*(.+)$/,
    grade: /^(الصف|صف|المرحله|الصف الدراسي|العمر|عمره|عمرها|السن)\s*(او العمر|\/\s*العمر)?\s*[:：\-–=]\s*(.+)$/,
    phone: /^(رقم|الرقم|رقم التواصل|رقم ولي الامر|الهاتف|الجوال|التلفون|واتساب|الواتساب|موبايل)[^:：\-–=]*[:：\-–=]\s*(.+)$/,
  };
  lines.forEach((l,i) => {
    const n = norm(l);
    for (const k in LABELS){
      const m = n.match(LABELS[k]);
      if (m && !out[k]){
        // نرجع النص الأصلي (بالهمزات) من نفس الموقع
        const val = l.slice(l.length - m[m.length-1].length).trim();
        out[k] = val; used.add(i); break;
      }
    }
  });

  const all = norm(txt);

  // ── الرقم ──
  const phoneSrc = out.phone || txt;
  const pm = phoneSrc.replace(/[\s\-()]/g,'').match(/(?:\+?973|00973)?([13679]\d{7})(?!\d)/);
  if (pm) out.phone = pm[1]; else if (out.phone && !/\d{7,}/.test(out.phone.replace(/\D/g,''))) delete out.phone;
  if (pm) lines.forEach((l,i)=>{ if (l.replace(/[\s\-()]/g,'').includes(pm[1])) used.add(i); });

  // ── نوع الاختبار ──
  if (/صعوبات|صعوبه|تعلم/.test(all)) out.type = 'ld';
  else if (/عربي|لغه/.test(all)) out.type = 'arabic';

  // ── حضوري / أونلاين ──
  if (/اونلاين|اون لاين|online|عن بعد|زوم|zoom|اونلين/i.test(all)) out.mode = 'online';
  else if (/حضوري|حضور|بالاكاديميه|بالمركز/.test(all)) out.mode = 'onsite';

  // ── الوقت (4:00–7:00 كل ربع ساعة) ──
  let mins = null;
  let tm = all.match(/(?:^|[^\d/])(\d{1,2})\s*[:.]\s*(\d{2})(?!\s*[/\-]\d)/);
  if (tm) mins = (+tm[1])*60 + (+tm[2]);
  else {
    tm = all.match(/(?:الساعه|ساعه|الساعة)\s*(\d{1,2})\s*(و\s*نص|ونص|و\s*ربع|وربع|الا\s*ربع|الا ربع)?/) ||
         all.match(/(?:^|\s)(\d{1,2})\s*(و\s*نص|ونص|و\s*ربع|وربع|الا\s*ربع)?\s*(?:العصر|عصرا|عصر|المغرب|مساء|مساءا|م)(?:\s|$)/);
    if (tm){
      mins = (+tm[1])*60;
      const q = (tm[2]||'').replace(/\s/g,'');
      if (q==='ونص') mins += 30; else if (q==='وربع') mins += 15; else if (q==='الاربع') mins -= 15;
    }
  }
  if (mins !== null){
    if (mins < 12*60) mins += 12*60;          // 4:15 = 16:15
    mins = Math.round(mins/15)*15;
    if (mins >= 16*60 && mins <= 19*60) out.time = String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
    else out.timeOutOfRange = true;
  }

  // ── اليوم ──
  const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const base = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const MONTHS = {'يناير':1,'فبراير':2,'مارس':3,'ابريل':4,'مايو':5,'يونيو':6,'يوليو':7,'اغسطس':8,'سبتمبر':9,'اكتوبر':10,'نوفمبر':11,'ديسمبر':12,
    'كانون الثاني':1,'شباط':2,'اذار':3,'نيسان':4,'ايار':5,'حزيران':6,'تموز':7,'اب':8,'ايلول':9,'تشرين الاول':10,'تشرين الثاني':11,'كانون الاول':12};
  let dt = null;
  let dm = all.match(/(?:^|[^\d:])(\d{1,2})\s*[\/\-.]\s*(\d{1,2})(?:\s*[\/\-.]\s*(\d{2,4}))?(?![\d:])/);
  if (dm){
    let y = dm[3] ? (+dm[3] < 100 ? 2000 + (+dm[3]) : +dm[3]) : base.getFullYear();
    dt = new Date(y, (+dm[2])-1, +dm[1]);
    if (!dm[3] && dt < base) dt.setFullYear(y+1);
  } else {
    const mn = Object.keys(MONTHS).sort((a,b)=>b.length-a.length).find(k => all.includes(k));
    const dn = mn && all.match(new RegExp('(\\d{1,2})\\s*(?:من\\s*)?(?:شهر\\s*)?'+mn+'(?:\\s*(\\d{4}))?'));
    if (dn){
      dt = new Date(dn[2] ? +dn[2] : base.getFullYear(), MONTHS[mn]-1, +dn[1]);
      if (!dn[2] && dt < base) dt.setFullYear(base.getFullYear()+1);
    } else {
      const m2 = all.match(/(?:شهر|الشهر)\s*(\d{1,2})\s*(?:يوم|تاريخ)?\s*(\d{1,2})?/);
      if (/(^|\s)(اليوم|الحين|هاليوم)(\s|$)/.test(all) && !/(اليوم|يوم) (المناسب|الاختبار)/.test(all)) dt = new Date(base.getTime());
      else if (/بكره|بكرا|غدا|باجر/.test(all)) dt = new Date(base.getTime()+86400000);
      else if (/عقب بكره|بعد بكره|بعد غد/.test(all)) dt = new Date(base.getTime()+2*86400000);
      else {
        const DAYS = [['الاحد',0],['الاثنين',1],['الإثنين',1],['الثلاثاء',2],['الثلاثا',2],['الاربعاء',3],['الاربعا',3],['الخميس',4],['السبت',6],['احد',0],['اثنين',1],['ثلاثاء',2],['اربعاء',3],['خميس',4],['سبت',6]];
        const hit = DAYS.find(([k]) => all.includes(norm(k)));
        if (hit){
          let diff = (hit[1] - base.getDay() + 7) % 7; if (diff === 0) diff = 7;
          dt = new Date(base.getTime() + diff*86400000);
        }
      }
    }
  }
  if (dt && !isNaN(dt)) out.date = iso(dt);

  // ── الصف / العمر ──
  if (!out.grade){
    const gm = txt.match(/((?:ال)?صف\s+(?:ال)?[؀-ۿ]+(?:\s+(?:ابتدائي|إعدادي|اعدادي|ثانوي|متوسط))?|(?:ال)?(?:أول|اول|ثاني|ثالث|رابع|خامس|سادس)\s+(?:ابتدائي|إعدادي|اعدادي|ثانوي)|(?:عمره|عمرها|العمر)?\s*\d{1,2}\s*(?:سنوات|سنين|سنه|سنة|سنا))/);
    if (gm) out.grade = gm[1].trim();
  }
  if (out.grade) out.grade = out.grade.replace(/[،,.:؛]+$/,'').trim();
  if (out.grade) lines.forEach((l,i)=>{ if (l.includes(out.grade)) used.add(i); });

  // ── الاسم: أول سطر "نظيف" ما فيه رقم ولا كلمات معروفة ──
  if (!out.name){
    const STOP = /صف|سن|عمر|رقم|اختبار|صعوب|عربي|لغه|حضور|اونلاين|online|زوم|السلام|مرحبا|هلا|الساعه|يوم|بكره|تاريخ|موعد|ابي|ابغي|نبي|ودي|لو سمحت|شكرا|الاحد|الاثنين|الثلاثاء|الاربعاء|الخميس|السبت|الجمعه|عصر|مساء|تسجيل|ولدي|بنتي|ابني/;
    for (let i=0;i<lines.length;i++){
      if (used.has(i)) continue;
      const l = lines[i], n = norm(l);
      if (/\d/.test(l) || STOP.test(n)) continue;
      const words = l.split(/\s+/);
      if (words.length >= 1 && words.length <= 6 && /^[؀-ۿ\s]+$/.test(l)) { out.name = l; break; }
    }
  }
  if (out.name) out.name = out.name.replace(/[،,.:]+$/,'').trim();
  return out;
}

const MODE_SEG = () => document.querySelector('.seg');
function flashFilled(el){ if(!el) return; el.classList.add('filled'); }

async function applyPaste(){
  const raw=document.getElementById('pasteTxt').value;
  const res=document.getElementById('pasteRes');
  if(!raw.trim()){ res.innerHTML='<span class="miss">الصق الرسالة أول</span>'; return; }
  try{ await DAYS_READY; }catch(_){}
  const r=parseInfo(raw,new Date());
  const got=[], miss=[], warn=[];
  const setV=(id,v,label)=>{ const el=document.getElementById(id); el.value=v; flashFilled(el); got.push(label); };
  if(r.name)  setV('f-name',r.name,'الاسم'); else miss.push('الاسم');
  if(r.grade) setV('f-grade',r.grade,'الصف/العمر'); else miss.push('الصف/العمر');
  if(r.phone) setV('f-phone',r.phone,'الرقم'); else miss.push('الرقم');
  if(r.type)  setV('f-type',r.type,'نوع الاختبار'); else miss.push('نوع الاختبار');
  if(r.mode){ document.getElementById(r.mode==='online'?'m-online':'m-onsite').checked=true; MODE_SEG().classList.add('filled'); got.push('حضوري/أونلاين'); }
  else miss.push('حضوري/أونلاين');
  if(r.date){
    const opt=document.querySelector('#f-date option[value="'+r.date+'"]');
    if(opt && !opt.disabled){ setV('f-date',r.date,'اليوم'); renderTimes(); }
    else if(opt && opt.disabled) warn.push('اليوم المطلوب ('+dateLabel(r.date)+') مكتمل — اختر يوم ثاني');
    else warn.push('اليوم المكتوب ('+dateLabel(r.date)+') مو متاح (فات، أو جمعة، أو بعيد) — اختر يوم من القائمة');
  } else miss.push('اليوم');
  if(r.time && timePassedToday(document.getElementById('f-date').value, r.time)) warn.push('الوقت المكتوب فات اليوم — اختر وقت بعده');
  else if(r.time) setV('f-time',r.time,'الوقت');
  else if(r.timeOutOfRange) warn.push('الوقت المكتوب برا 4:00–7:00 — اختر وقت من القائمة');
  else miss.push('الوقت');
  res.innerHTML =
    (got.length?'<b>✓ تعبّت: '+got.join('، ')+'</b>':'')+
    (miss.length?'<div class="miss">✎ ما لقيتها بالرسالة، عبّها بنفسك: '+miss.join('، ')+'</div>':'')+
    warn.map(w=>'<div class="miss">⚠ '+esc(w)+'</div>').join('')+
    (got.length?'<div style="color:#64748b">راجع الخانات الخضرا قبل الإرسال</div>':'');
}
document.getElementById('pasteToggle').addEventListener('click',()=>{
  const b=document.getElementById('pasteBox'); b.hidden=!b.hidden; if(!b.hidden) document.getElementById('pasteTxt').focus();
});
document.getElementById('pasteBtn').addEventListener('click',applyPaste);
document.getElementById('pasteTxt').addEventListener('paste',()=>setTimeout(applyPaste,30));

async function submitDiagRequest(entry){
  // 1) اقرأ آخر نسخة محفوظة بالسحابة لهذه القائمة
  const list = await fetchDiagList();

  // 2) تأكد من القواعد مرة ثانية (ممكن اليوم امتلأ وأنت تعبّي النموذج)
  const ok = dayAllowed(list, entry.date);
  if(ok !== 'ok') { const e = new Error(ok); e.rule = ok; throw e; }
  if(!ALLOWED_TIMES.includes(entry.time)) { const e = new Error('time'); e.rule = 'time'; throw e; }
  if(timePassedToday(entry.date, entry.time)) { const e = new Error('past'); e.rule = 'past'; throw e; }

  // 3) ضيف الطلب الجديد
  list.push(entry);

  // 4) ارفع النسخة المحدثة (upsert على نفس الصف)
  const putRes = await fetch(`${SB_URL}/rest/v1/bealqalam_data`, {
    method:'POST',
    headers:{
      apikey: SB_KEY,
      Authorization: 'Bearer '+SB_KEY,
      'Content-Type':'application/json',
      Prefer:'resolution=merge-duplicates'
    },
    body: JSON.stringify([{ key: DB_KEY, value: JSON.stringify(list), updated_at: new Date().toISOString() }])
  });
  if(!putRes.ok) throw new Error('save failed');
}

// ═══ استمارة التأكيد ═══
let LAST = null; // آخر تسجيل

function slipHTML(e){
  const modeColor = e.mode==='online' ? 'background:#f3e8ff;color:#7c3aed' : 'background:#dcfce7;color:#15803d';
  const note = e.mode==='online'
    ? '💻 الاختبار أونلاين — بيوصلكم رابط الاختبار على الواتساب قبل الموعد. نرجو تجهيز جهاز بكاميرا ومكان هادئ للطالب.'
    : '🏫 الاختبار حضوري — نرجو الحضور قبل الموعد بـ 10 دقائق.<br>📍 '+esc(LOCATION_TXT);
  return `<div class="slip" id="slipCard">
    <div class="hd"><img src="${LOGO}" alt=""><div><div class="n">أكاديمية بالقلم</div><div class="s">استمارة موعد الاختبار التشخيصي</div></div></div>
    <div class="bd">
      <div class="t"><i></i>تأكيد موعد الاختبار</div>
      <div class="when">
        <div class="l">موعد الاختبار</div>
        <div class="d">${esc(dateLabel(e.date))}</div>
        <div class="h">الساعة ${esc(timeLabel(e.time))}</div>
      </div>
      <table>
        <tr><td class="k">اسم الطالب</td><td class="v">${esc(e.name)}</td></tr>
        <tr><td class="k">الصف / العمر</td><td class="v">${esc(e.grade||'—')}</td></tr>
        <tr><td class="k">رقم ولي الأمر</td><td class="v" dir="ltr" style="text-align:right">${esc(e.phone)}</td></tr>
        <tr><td class="k">نوع الاختبار</td><td class="v">${esc(TYPE_LABEL[e.type]||'')}</td></tr>
        <tr><td class="k">طريقة الاختبار</td><td class="v"><span class="pill" style="${modeColor}">${esc(MODE_LABEL[e.mode]||'')}</span></td></tr>
      </table>
      <div class="note">${note}</div>
    </div>
    <div class="ft"><span>رقم الطلب: ${esc(e.id.replace('diag_','').slice(-6))}</span><span>تاريخ التسجيل: ${new Date().toLocaleDateString('ar-BH-u-nu-latn')}</span></div>
  </div>`;
}

function waText(e){
  return 'السلام عليكم ورحمة الله 🌷\n'
    + 'تم تأكيد موعد الاختبار التشخيصي في أكاديمية بالقلم:\n\n'
    + '👤 اسم الطالب: ' + e.name + '\n'
    + (e.grade ? '🎓 الصف / العمر: ' + e.grade + '\n' : '')
    + '📞 رقم ولي الأمر: ' + e.phone + '\n'
    + '📝 نوع الاختبار: ' + (TYPE_LABEL[e.type]||'') + '\n'
    + '📍 طريقة الاختبار: ' + (MODE_LABEL[e.mode]||'') + '\n'
    + '📅 الموعد: ' + dateLabel(e.date) + ' — الساعة ' + timeLabel(e.time) + '\n'
    + (e.mode==='online'
        ? '\nبيوصلكم رابط الاختبار على الواتساب قبل الموعد.'
        : '\nلوكيشن الأكاديمية:\n' + LOCATION_TXT + '\n' + LOCATION_URL);
}
function waNumber(p){let x=String(p||'').replace(/\D/g,'');if(x.startsWith('00'))x=x.slice(2);if(x.length===8)x='973'+x;return x;}

async function slipImage(){
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(_){}
  const el = document.getElementById('slipCard');
  const canvas = await html2canvas(el, {scale:3, backgroundColor:'#ffffff', useCORS:true});
  const blob = await new Promise(r=>canvas.toBlob(r,'image/png'));
  return {blob, name:'موعد الاختبار - '+LAST.name+'.png'};
}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);}
function doneMsg(t,err){const m=document.getElementById('doneMsg');m.textContent=t;m.className='msg '+(err?'err':'ok');}

document.getElementById('btnSave').addEventListener('click', async function(){
  this.disabled=true;
  try{ const {blob,name}=await slipImage(); downloadBlob(blob,name); doneMsg('✓ تم حفظ الصورة'); }
  catch(e){ console.warn(e); doneMsg('ما قدرت أحفظ الصورة — خذ سكرين شوت للاستمارة',true); }
  finally{ this.disabled=false; }
});

document.getElementById('btnSend').addEventListener('click', async function(){
  this.disabled=true;
  const text = waText(LAST);
  try{
    // بالجوال: نرسل صورة الاستمارة نفسها مع النص
    let shared=false;
    try{
      const {blob,name}=await slipImage();
      const file=new File([blob],name,{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text});
        shared=true; doneMsg('✓ تم');
      }
    }catch(e){ if(e && e.name==='AbortError'){ shared=true; } }
    // بالكمبيوتر: نفتح محادثة ولي الأمر بالواتساب والرسالة مكتوبة جاهزة
    if(!shared){
      window.open('https://wa.me/'+waNumber(LAST.phone)+'?text='+encodeURIComponent(text),'_blank');
      doneMsg('✓ انفتح الواتساب والرسالة جاهزة — لو تبي ترسل الصورة بعد، اضغط "حفظ الاستمارة كصورة" وأرفقها');
    }
  }finally{ this.disabled=false; }
});

document.getElementById('btnNew').addEventListener('click', function(){
  document.getElementById('diagForm').reset();
  document.getElementById('pasteRes').innerHTML='';
  document.querySelectorAll('.filled').forEach(e=>e.classList.remove('filled'));
  document.getElementById('msg').className='msg';
  document.getElementById('doneMsg').className='msg';
  document.getElementById('doneBox').style.display='none';
  document.getElementById('diagForm').style.display='block';
  document.getElementById('subTitle').style.display='block';
  const btn=document.getElementById('submitBtn'); btn.disabled=false; btn.textContent='إرسال الطلب';
  loadDays();
  window.scrollTo({top:0,behavior:'smooth'});
});

document.getElementById('diagForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.className = 'msg';

  const name  = document.getElementById('f-name').value.trim();
  const grade = document.getElementById('f-grade').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const type  = document.getElementById('f-type').value;
  const mode  = (document.querySelector('input[name="mode"]:checked')||{}).value;
  const date  = document.getElementById('f-date').value;
  const time  = document.getElementById('f-time').value;

  if(!name || !phone || !date || !time || !mode){
    msg.textContent = 'عبوا الحقول المطلوبة من فضلكم';
    msg.className = 'msg err';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'جارِ الإرسال...';

  const clean = (v,n) => String(v||'').replace(/[<>"'`&]/g,'').slice(0,n).trim();
  const entry = {
    id: 'diag_'+Date.now(),
    name: clean(name,80),
    phone: clean(phone,20).replace(/[^0-9+ ]/g,''),
    grade: clean(grade,40),
    date, time, type: type==='ld' ? 'ld' : 'arabic',
    mode: mode==='online' ? 'online' : 'onsite',
    result:'', status:'pending',
    notes:'تم التسجيل عبر رابط ولي الأمر — الاختبار '+(mode==='online'?'أونلاين':'حضوري'),
    source:'parent'
  };

  try{
    await submitDiagRequest(entry);
    // تنبيه بالإيميل للأكاديمية (ما ننتظره — لو فشل ما يأثر على التسجيل)
    try{
      fetch(NOTIFY_URL, {
        method:'POST', mode:'no-cors', keepalive:true,
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({
          action:'diagNotify', name: entry.name, phone: entry.phone, grade: entry.grade, type: entry.type,
          mode: entry.mode,
          date: entry.date, time: entry.time,
          dateLabel: dateLabel(entry.date),
          timeLabel: timeLabel(entry.time) + ' — ' + MODE_LABEL[entry.mode]
        })
      }).catch(()=>{});
    }catch(_){}
    LAST = entry;
    document.getElementById('slip').innerHTML = slipHTML(entry);
    document.getElementById('diagForm').style.display='none';
    document.getElementById('subTitle').style.display='none';
    document.getElementById('doneBox').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
    console.warn(err);
    const RULE_MSG = {
      full:   'هذا اليوم اكتمل (5 اختبارات). اختر يوم ثاني من فضلكم',
      friday: 'لا توجد اختبارات يوم الجمعة. اختر يوم ثاني من فضلكم',
      time:   'أوقات الاختبار من 4:00 إلى 7:00 مساءً فقط',
      past:   'هالوقت فات اليوم، اختر وقت بعده'
    };
    msg.textContent = RULE_MSG[err.rule] || 'حصل خطأ، حاول مرة ثانية أو تواصل معنا مباشرة';
    if(err.rule === 'full') loadDays();
    msg.className = 'msg err';
    btn.disabled = false;
    btn.textContent = 'إرسال الطلب';
  }
});
